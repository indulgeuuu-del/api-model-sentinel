name: Bug report / 问题反馈
description: 提供脱敏复现，帮助改进兼容性与可靠性
body:
  - type: markdown
    attributes:
      value: 不要上传API Key、本机连接码、完整数据目录或真实工作日志。安全漏洞请使用Security私密报告。
  - type: input
    id: environment
    attributes:
      label: 环境 / Environment
      placeholder: 版本、系统、node --version、浏览器
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与预期结果
      description: 优先使用Demo或脱敏的本机模拟响应复现。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可提供HTTP状态、协议、探针版本与脱敏错误信息。
    validations:
      required: true
